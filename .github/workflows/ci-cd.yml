name: CI/CD Pipeline - Automated Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_build:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Next.js Standalone
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🐳 Docker Build Test
        run: |
          docker build -t zypage-creator-platform:latest .
          echo "✅ Docker Image built successfully!"
